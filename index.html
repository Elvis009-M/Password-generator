<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMAKK | Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="images/emakk.jpeg" alt="">
        EMAKK
    </header>

   <main>
        <div class="container">
            <h2>Password Generator</h2>
            <input type="text" id="password" readonly placeholder="Your secure password" />
            
            <div class="length-control">
                <label for="length">Length: <span id="lengthValue">12</span></label>
                <input type="range" id="length" min="6" max="32" value="12" />
            </div>

            <div class="options">
                <label><input type="checkbox" id="uppercase" checked /> Uppercase</label>
                <label><input type="checkbox" id="lowercase" checked /> Lowercase</label>
                <label><input type="checkbox" id="numbers" checked /> Numbers</label>
                <label><input type="checkbox" id="symbols" /> Symbols</label>
            </div>

            <button onclick="generatePassword()">Generate Password</button>
            <button class="copy-btn" onclick="copyPassword()">Copy to Clipboard</button>
            <div class="message" id="message"></div>
        </div>
   </main> 

   <footer>

                <a href="https://emakk.vercel.app" class="footerlink"> Main Page</a>
            </div>

            </div>

</body>
</html>
